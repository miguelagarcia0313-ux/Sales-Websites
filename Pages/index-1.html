<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market Catalog — Demo Package 1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../Assets/CSS/styles-1.css">
</head>

<body>
  <!-- Demo Tape: quítala cuando entregues el sitio final al cliente -->
  <div style="background:#1a1a1a;color:#fff;text-align:center;padding:8px 14px;font-family:'Inter',sans-serif;font-size:13px;">
    Demo — Package 1: Basic Catalog ($130) · <a href="../index.html" style="color:#ffde59;">Go back to packages</a>
  </div>

  <!-- Top Contact Bar -->
  <div class="contact-bar">
    <a id="phone-link" href="tel:+18324849161" class="phone-link">
      <svg viewBox="0 0 24 24" class="phone-icon" aria-hidden="true">
        <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.9 21 3 13.1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1L6.6 10.8z"/>
      </svg>
      <span id="phone-number">832-484-9161</span>
    </a>
  </div>

  <!-- Banner de la tienda -->
  <banner class="store-banner">
    <div class="banner-content">
      
      <div class="banner-text">
        <h1 id="store-name" class="store-name">Market Catalog</h1>
        <p class="store-tagline">Your Food, Your Choice</p>
      </div>
    </div>
  </banner>

  <!-- Encabezado simple -->
  <header class="header">
    <a href="#contact-section" class="contact-cta">Contact Me</a>
  </header>

  <!-- Pestañas de categoría (sin buscador) -->
  <div id="category-tabs" class="category-tabs"></div>

  <!-- Cuadrícula de productos -->
  <main id="product-grid" class="product-grid"></main>
  <p id="empty-message" class="empty-message" hidden>Couldn't find products that coincide with your search.</p>

  <!-- ============ CONTACT ============ -->
<section id="contact-section" class="contact-section">
    <div class="contact-card">
      <p class="contact-eyebrow">Contact Me</p>
      <h2>Let's Talk</h2>
      <p>Find me by Phone or WhatsApp</p>
      <div class="contact-links">
        <a href="tel:+18324849161">📞 Phone</a>
        <a href="https://wa.me/18324849161" target="_blank" rel="noreferrer">💬 WhatsApp</a>
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <p>Made by Miguel Garcia · 2026</p>
  </footer>

  <script src="../Assets/JS/script-1.js"></script>
</body>
</html>
